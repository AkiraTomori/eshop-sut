name: HW4 Playwright CI

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/hw4-playwright.yml'
      - 'backend/**'
      - 'frontend-web/**'
      - 'frontend-admin/**'
      - '23127379_Homework/HW4/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/hw4-playwright.yml'
      - 'backend/**'
      - 'frontend-web/**'
      - 'frontend-admin/**'
      - '23127379_Homework/HW4/**'
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hw4-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  test:
    name: ${{ matrix.feature.id }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        feature:
          - id: FR06
            spec: Pool-A_FR06/fr06.spec.ts
          - id: FR08
            spec: Pool-B_FR08/fr08.spec.ts
          - id: FR15
            spec: Pool-C_FR15/fr15.spec.ts
        browser: [chromium, firefox, webkit]

    defaults:
      run:
        working-directory: 23127379_Homework/HW4

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-web/package-lock.json
            frontend-admin/package-lock.json
            23127379_Homework/HW4/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install web dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Install admin dependencies
        run: npm ci
        working-directory: frontend-admin

      - name: Install HW4 test dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('23127379_Homework/HW4/package-lock.json') }}

      - name: Install Playwright browsers and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run ${{ matrix.feature.id }} on ${{ matrix.browser }}
        run: npx playwright test "${{ matrix.feature.spec }}" --project="${{ matrix.browser }}"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ci-output/playwright-report
          HW4_RESULTS_DIR: ci-output/test-results
          HW4_JSON_OUTPUT_FILE: ci-output/test-results/results.json
          HW4_RUN_TIMESTAMP: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload HTML report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hw4-${{ matrix.feature.id }}-${{ matrix.browser }}
          path: |
            23127379_Homework/HW4/ci-output/playwright-report/
            23127379_Homework/HW4/ci-output/test-results/
          if-no-files-found: warn
          retention-days: 14
